<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Portfolio | Resume</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="resume">
  <div class="progress" aria-hidden="true"><div class="progress__bar" id="progressBar"></div></div>

  <header class="header">
    <div class="container header__inner">
      <div class="brand">
        <div class="brand__logo">MA</div>
        <div class="brand__text">
          <div class="brand__name">Your Name</div>
          <div class="brand__tag">Resume</div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <a class="nav__link" data-link="home" href="index.html">Home</a>
        <a class="nav__link" data-link="resume" href="resume.html">Resume</a>
        <a class="nav__link" data-link="projects" href="projects.html">Projects</a>
        <a class="nav__link" data-link="extras" href="extracurriculars.html">Extracurriculars</a>
        <a class="nav__link" data-link="awards" href="awards.html">Awards & Certifications</a>
        <a class="nav__link" data-link="contact" href="contact.html">Contact</a>
      </nav>

      <div class="header__actions">
        <button class="icon-btn icon-btn--menu" id="menuBtn" aria-label="Open menu">Menu</button>
      </div>
    </div>
  </header>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__panel" role="dialog" aria-modal="true" aria-label="Menu">
      <div class="drawer__top">
        <span class="drawer__title">Menu</span>
        <button class="icon-btn" id="closeDrawer" aria-label="Close">✕</button>
      </div>
      <div class="drawer__links">
        <a class="drawer__link" href="index.html">Home</a>
        <a class="drawer__link" href="resume.html">Resume</a>
        <a class="drawer__link" href="projects.html">Projects</a>
        <a class="drawer__link" href="extracurriculars.html">Extracurriculars</a>
        <a class="drawer__link" href="awards.html">Awards & Certifications</a>
        <a class="drawer__link" href="contact.html">Contact</a>
      </div>
    </div>
    <div class="drawer__backdrop" id="drawerBackdrop"></div>
  </div>

  <main class="container">
    <section class="section reveal">
      <h1 class="section__title">Resume</h1>
      <div class="card">
        <p class="small">Upload your resume as an image named <b>images/resume.jpg</b>.</p>
        <div class="ph ph--resume">
          <img src="images/resume.jpg" alt="Resume image" onerror="this.remove(); this.parentElement.querySelector('.ph__empty').style.display='block';">
          <div class="ph__empty">Add <b>images/resume.jpg</b><br>(Screenshot or exported JPG)</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">© <span id="year"></span> Your Name</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
